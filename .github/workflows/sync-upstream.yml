name: Sync upstream

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.repository == 'theLlamaNet/halo-ce-android' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
      base: ${{ steps.candidate.outputs.base }}
      candidate: ${{ steps.candidate.outputs.candidate }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch upstream commits without tags
        run: git fetch --no-tags https://github.com/cybersecurity/halo-ce-universal.git refs/heads/main:refs/remotes/upstream/main
      - name: Prepare candidate without changing main
        id: candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 tools/sync_upstream.py --report "$RUNNER_TEMP/upstream-sync.json" --publish
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'upstream-sync.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('base', 'candidate', 'branch'):
                  print(f'{key}={report.get(key, "")}', file=output)
              print('changed='+str(report['changed']).lower(), file=output)
          PY
      - name: Sync report
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP'])/'upstream-sync.json'
          if report.exists():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  print('### Upstream sync report', file=summary)
                  print('```json', file=summary)
                  print(report.read_text(), file=summary)
                  print('```', file=summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-sync-report
          path: ${{ runner.temp }}/upstream-sync.json
          if-no-files-found: ignore
          retention-days: 14

  validate:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.candidate }}
    secrets: inherit
    permissions:
      contents: read

  promote:
    needs: [prepare, validate]
    if: needs.prepare.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SYNC_BASE: ${{ needs.prepare.outputs.base }}
      SYNC_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
      SYNC_BRANCH: ${{ needs.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Promote only the exact validated candidate
        run: |
          git fetch --no-tags origin main "$SYNC_BRANCH"
          current="$(git rev-parse refs/remotes/origin/main)"
          if [ "$current" != "$SYNC_BASE" ]; then
            echo 'Main changed during validation; the next sync will rebuild on the new main.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git merge-base --is-ancestor "$SYNC_BASE" "$SYNC_CANDIDATE"
          git push origin "$SYNC_CANDIDATE:refs/heads/main"
          echo "Validated upstream update promoted: $SYNC_CANDIDATE" >> "$GITHUB_STEP_SUMMARY"
          # Keep failed candidates for inspection; delete only this successful bot branch.
          case "$SYNC_BRANCH" in
            codex/upstream-sync-*) git push origin --delete "$SYNC_BRANCH" ;;
            *) echo 'Unexpected sync branch name'; exit 1 ;;
          esac
